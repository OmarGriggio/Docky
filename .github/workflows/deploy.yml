name: Deploy

# Runs on every push to main (the deploy branch - day-to-day work happens on
# develop, see the Workflow section in CLAUDE.md). Tests and builds gate the deploy: the
# ssh step only runs if both jobs below succeed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only GitHub token - nothing here writes to the repo; the deploy goes
# through its own SSH key, not this token.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Starts its own throwaway Postgres in Docker (Testcontainers) - the
      # runner has Docker already, nothing to set up here.
      - run: npm run test:integration

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      # Builds happen on the VPS itself (docker compose ... --build), same
      # as the documented manual redeploy in CLAUDE.md - this workflow just
      # automates those exact steps instead of building/pushing images to a
      # registry. Revisit if the VPS ever struggles with the build load.
      - name: SSH and redeploy
        # Pinned to the commit behind tag v1.0.3, not the tag itself: a tag
        # can be moved, and this step holds the server's deploy SSH key.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/docky
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
