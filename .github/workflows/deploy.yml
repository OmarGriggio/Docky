name: Deploy

# Runs on every push to main (the deploy branch - day-to-day work happens on
# develop, see the Workflow section in CLAUDE.md). The tests gate the images,
# the images gate the deploy: built here, pushed to GitHub's registry (GHCR),
# the server only pulls them - it compiles nothing (its 2 GB froze building
# them itself, 2026-11-19, see zz_docs/Deployment.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only GitHub token - nothing here writes to the repo; the deploy goes
# through its own SSH key, not this token.
permissions:
  contents: read

# Two pushes close together deploy one after the other, never at once - the
# older one can't finish last and end up live.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Starts its own throwaway Postgres in Docker (Testcontainers) - the
      # runner has Docker already, nothing to set up here.
      - run: npm run test:integration

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  build-images:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    # The only job allowed to write: pushing the images to this repo's packages.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and push ghcr.io/omargriggio/docky-${{ matrix.app }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/omargriggio/docky-${{ matrix.app }}
          version=$(node -p "require('./backend/package.json').version")
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The registry cache needs buildx's own builder, not the default one.
          docker buildx create --use --driver docker-container
          # Tagged with the commit (what the deploy below pulls - the one tag
          # never moved), the version (moved by a later push without a version
          # bump) and latest. The build stages are cached in the registry
          # (buildcache), so an unchanged npm install isn't redone. The label
          # linking the package to this repo is in the Dockerfiles.
          docker buildx build ./${{ matrix.app }} --target prod --push \
            --tag "$image:${{ github.sha }}" --tag "$image:$version" --tag "$image:latest" \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max"

  deploy:
    needs: [build-images]
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        # Pinned to the commit behind tag v1.0.3, not the tag itself: a tag
        # can be moved, and this step holds the server's deploy SSH key.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/docky
            # Still pulled: the compose file, the migrations (bind-mounted
            # into the backend) and nginx's config come from the repo.
            git pull
            # The images this very run built. --no-build: an image that couldn't
            # be pulled stops the deploy here, the running containers untouched -
            # never a build on the server instead (a failed pull is only a
            # warning for a service that also has a build: section).
            export DOCKY_IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.prod.yml up -d --no-build
            # The gateway resolves the backend's address once: without a
            # reload it keeps proxying to the container just replaced (a 502).
            docker exec docky-nginx nginx -s reload
            # Docky's own images no container uses any more (the Dockerfiles' label)
            # - never another app's on this server. Any version can be pulled
            # back from GHCR.
            docker image prune -af --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"
