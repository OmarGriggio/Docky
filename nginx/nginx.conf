# Gateway in front of both containers - the only thing reachable from
# outside the host (see docker-compose.prod.yml, only this service publishes
# a port). No real domain, but see zz_docs/Decisions.md - sslip.io gives a
# free hostname that resolves to this server's IP, which is enough for
# Let's Encrypt to issue a real certificate (it won't certify a bare IP).
server {
    listen 80;
    server_name _;

    # certbot's webroot plugin drops its challenge files here; Let's Encrypt
    # then fetches them over plain HTTP to prove we control this host. Kept
    # on plain HTTP even after HTTPS is live below - renewal uses the same
    # method, and the HTTP-01 challenge is always fetched unencrypted.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else on plain HTTP redirects to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 179-237-86-113.sslip.io;

    ssl_certificate /etc/letsencrypt/live/179-237-86-113.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/179-237-86-113.sslip.io/privkey.pem;

    client_max_body_size 10M;

    # /api/client -> http://backend:3000/client (the /api/ prefix is
    # stripped because proxy_pass's target URI ends in "/"). This also
    # covers /api/uploads/... for company logos, since the frontend already
    # builds that URL from environment.apiUrl (see company.service.ts).
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Angular app - its own nginx (frontend/nginx.conf)
    # handles the SPA fallback (try_files ... /index.html).
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
