# Reverse proxy to the backend API. No server_name yet (no domain pointed at
# the server yet - see zz_docs/Decisions.md) - "_" matches any Host header.
# Once a domain exists, this becomes the base for adding a certbot-issued
# HTTPS server block. Once the frontend is containerized, this file also
# needs a location serving its static files, with only the API paths (or an
# /api prefix) proxied to the backend - not done yet, backend-only for now.
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
