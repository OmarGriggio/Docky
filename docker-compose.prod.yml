services:

  postgres:
    image: postgres:${POSTGRES_VERSION}

    container_name: ${POSTGRES_CONTAINER_NAME}

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # No port published to the host here, unlike docker-compose.yml (dev) -
    # only other containers on this compose's network can reach Postgres.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./zz_migrations/000_base.sql:/docker-entrypoint-initdb.d/000_base.sql
      - ./zz_migrations/001_data.sql:/docker-entrypoint-initdb.d/001_data.sql


  backend:
    container_name: ${BACKEND_CONTAINER_NAME}

    build:
      context: ./backend
      target: prod

    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - minio

    # No port published either - only nginx (below) is reachable from
    # outside the host.


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    container_name: docky-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    # No port published - only the backend (over the compose network) can
    # reach it, same "nothing but nginx faces the internet" rule as the
    # other services here. No console either; browse via an SSH tunnel to
    # this host's own :9001 if that's ever needed.
    volumes:
      - minio_data:/data


  frontend:
    container_name: docky-frontend

    build:
      context: ./frontend
      target: prod

    restart: unless-stopped

    # No port published - only nginx (below) is reachable from outside.


  nginx:
    image: nginx:1.27-alpine
    container_name: docky-nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Host paths (not repo-relative) - certbot on the host writes here
      # directly, nginx just needs read access to the same files.
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - backend
      - frontend


volumes:
  postgres_data:
  minio_data:
