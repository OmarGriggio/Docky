services:

  postgres:
    image: postgres:${POSTGRES_VERSION}

    container_name: ${POSTGRES_CONTAINER_NAME}

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./zz_migrations/000_base.sql:/docker-entrypoint-initdb.d/000_base.sql
      - ./zz_migrations/001_data.sql:/docker-entrypoint-initdb.d/001_data.sql


  backend:
    container_name: ${BACKEND_CONTAINER_NAME}

    build:
      context: ./backend
      target: dev

    ports:
      - "${BACKEND_PORT}:3000"

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_started
      # Waits for MinIO to actually answer, not just for its container to
      # start - server.ts's ensureBucketExistsServ() only runs once at
      # startup, no retry, and used to lose that race against MinIO still
      # initializing (ECONNREFUSED, bucket silently never created).
      minio:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - /app/node_modules


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    container_name: docky-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    ports:
      # 9000: S3 API (what the backend's SDK talks to). 9001: web console,
      # only useful in dev to browse buckets by hand - not published in prod.
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


volumes:
  postgres_data:
  minio_data: