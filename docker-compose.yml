services:

  postgres:
    image: postgres:${POSTGRES_VERSION}

    container_name: ${POSTGRES_CONTAINER_NAME}

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./zz_migrations/000_base.sql:/docker-entrypoint-initdb.d/000_base.sql
      - ./zz_migrations/001_data.sql:/docker-entrypoint-initdb.d/001_data.sql
      - ./uploads:/app/uploads


  backend:
    container_name: ${BACKEND_CONTAINER_NAME}

    build:
      context: ./backend

    ports:
      - "${BACKEND_PORT}:3000"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

    volumes:
      - ./backend:/app
      - /app/node_modules


volumes:
  postgres_data: