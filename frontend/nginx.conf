# Serves the built Angular SPA. try_files falls back to index.html for any
# path that isn't a real file, so client-side routes (e.g. /dashboard,
# /clients/3) work on a hard refresh/direct link instead of 404ing - Angular's
# router then takes over in the browser. This container is only reached
# through the gateway nginx (see nginx/nginx.conf at the repo root), which
# proxies /api/* to the backend and everything else here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # outputHashing: "all" (angular.json) means JS/CSS/media filenames change
    # on every build, so caching them aggressively is safe - a new deploy
    # ships new filenames, never a stale cache hit.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The PWA's service worker and its manifest keep the same name from one
    # build to the next - they're how an installed app finds out a new
    # version exists, so they must never be cached (an exact-match location
    # wins over the regex above, ngsw-worker.js included).
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
    # nginx's own mime.types has no entry for .webmanifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
