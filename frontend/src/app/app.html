<div class="layout">
  <app-nav-bar />
  <div class="flex-1 min-w-0 flex flex-col bg-gray-50">
    <app-header class="hidden md:block sticky top-0 z-10" />
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
<app-demo-banner />
<!-- NotificationService's messages. @defer: the toast's own code stays out of
     the initial bundle, loaded right after the first render (not on idle - a
     message sent before it's there would be lost). -->
@defer (on immediate) {
  <p-toast position="top-right" [breakpoints]="{ '767px': { width: 'calc(100% - 2rem)', left: '1rem', right: '1rem' } }" />
}
