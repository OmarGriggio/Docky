@if (isAuthenticated()) {
  <header class="h-12 shrink-0 flex items-center px-7 bg-gray-100 pt-4.5">
    <!-- @defer: p-breadcrumb (and what it pulls in) lands in its own
         lazy chunk instead of the initial bundle - this shell is loaded
         eagerly, unlike the feature pages. -->
    @defer (on idle) {
      <p-breadcrumb [model]="items()" [home]="home" styleClass="p-0! bg-transparent!">
        <ng-template #item let-item>
          @if (item.ellipsis) {
            <div class="relative">
              <button type="button" class="px-1 text-gray-500 hover:text-gray-900 cursor-pointer bg-transparent border-0" title="Pages précédentes" (click)="toggleHidden($event)">…</button>
              @if (hiddenOpen()) {
                <div class="absolute left-0 top-full mt-2 min-w-40 bg-white border border-gray-200 rounded-md shadow-lg p-1 z-20">
                  @for (entry of hiddenEntries(); track entry.key) {
                    <a [routerLink]="entry.path" [queryParams]="entry.queryParams" class="block px-3 py-2 rounded text-gray-800 no-underline text-sm whitespace-nowrap hover:bg-gray-100">{{ entry.label }}</a>
                  }
                </div>
              }
            </div>
          } @else if (item.icon) {
            <a [routerLink]="item.routerLink" class="text-gray-500 hover:text-gray-900"><i [class]="item.icon"></i></a>
          } @else if (item.routerLink) {
            <a [routerLink]="item.routerLink" [queryParams]="item.queryParams" class="text-sm text-gray-500 hover:text-gray-900 no-underline">{{ item.label }}</a>
          } @else {
            <span class="text-sm font-medium text-gray-900">{{ item.label }}</span>
          }
        </ng-template>
      </p-breadcrumb>
    }
  </header>
}
