<nav>
  @for (item of navItems; track item.label) {
    @if (item.links.length > 1) {
      <details>
        <summary>{{ item.label }}</summary>
        @for (link of item.links; track link.label) {
          <a [routerLink]="link.path" [queryParams]="link.queryParams">{{ link.label }}</a>
        }
      </details>
    } @else {
      <a [routerLink]="item.links[0].path" [queryParams]="item.links[0].queryParams">{{ item.label }}</a>
    }
  }

  <div class="nav-bar__auth">
    @if (isAuthenticated()) {
      <span class="nav-bar__user">{{ currentUser()?.email }}</span>
      <button type="button" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login">Connexion</a>
      <a routerLink="/register">Inscription</a>
    }
  </div>
</nav>
