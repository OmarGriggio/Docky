@if (isDemoCompany()) {
  <p-drawer [(visible)]="visible" position="bottom" [modal]="false" styleClass="ui-demo-drawer !bg-orange-50" [style]="{ height: 'auto' }">
    <ng-template #header>
      <p class="text-sm text-orange-900 whitespace-nowrap m-0">Vous êtes sur l'entreprise de démonstration : vous pouvez tester librement toutes les fonctionnalités. Les données de cette entreprise sont réinitialisées chaque dimanche à 02h00.</p>
    </ng-template>
  </p-drawer>
}
