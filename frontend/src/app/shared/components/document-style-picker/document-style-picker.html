<div class="flex flex-col gap-3">
  <div class="grid gap-3" [class]="compact() ? 'grid-cols-3' : 'grid-cols-1 sm:grid-cols-3'" role="radiogroup" [attr.aria-label]="'profile.documentStyle.layout' | transloco">
    @for (option of layoutOptions; track option.value) {
      <button
        type="button" role="radio" [attr.aria-checked]="layout() === option.value" [disabled]="disabled()"
        (click)="pickLayout(option.value)"
        class="flex gap-3 text-left rounded-lg border-2 transition-colors disabled:cursor-default"
        [class]="(compact() ? 'flex-col items-center p-2 ' : 'flex-col items-start p-3 ')
          + (layout() === option.value ? 'border-(--p-primary-color) bg-green-50' : 'bg-white border-gray-200 hover:border-gray-300 enabled:cursor-pointer')"
      >
        <!-- A page in miniature. -->
        <span class="shrink-0 w-20 h-28 bg-white border border-gray-300 rounded-sm shadow-sm p-1.5 flex flex-col gap-1" aria-hidden="true">
          @if (option.value === 'CLASSIC') {
            <span class="flex justify-between"><span class="w-5 h-1 bg-gray-300"></span><span class="w-7 h-3 bg-gray-300"></span></span>
            <span class="w-10 h-1.5 bg-gray-700 mt-1"></span>
            <span class="flex justify-between"><span class="w-8 h-0.5 bg-gray-400"></span><span class="w-3 h-0.5 bg-gray-400"></span></span>
            <span class="flex justify-between"><span class="w-9 h-0.5 bg-gray-400"></span><span class="w-3 h-0.5 bg-gray-400"></span></span>
            <span class="flex justify-between"><span class="w-7 h-0.5 bg-gray-400"></span><span class="w-3 h-0.5 bg-gray-400"></span></span>
            <span class="border-t border-b border-gray-700 h-1.5 mt-1"></span>
            <span class="mt-auto text-[0.5rem] leading-none text-gray-400 text-center">+ {{ 'profile.documentStyle.detailsPage' | transloco }}</span>
          } @else if (option.value === 'BANNER') {
            <span class="-mx-1.5 -mt-1.5 h-4 flex items-center justify-between px-1.5" [style.background]="titleColor() || '#2b2b2b'"><span class="w-5 h-1 bg-white/70"></span><span class="w-4 h-1.5 bg-white/90"></span></span>
            <span class="self-end w-7 h-2.5 bg-gray-300 mt-0.5"></span>
            <span class="grid grid-cols-3 border border-gray-300 h-2.5"><span class="border-r border-gray-300"></span><span class="border-r border-gray-300"></span><span></span></span>
            <span class="flex items-center gap-0.5 mt-0.5"><span class="w-0.5 h-1.5" [style.background]="titleColor() || '#2b2b2b'"></span><span class="w-6 h-1 bg-gray-500"></span></span>
            <span class="h-1 bg-gray-200"></span>
            <span class="h-0.5 bg-gray-300"></span>
            <span class="flex items-center gap-0.5"><span class="w-0.5 h-1.5" [style.background]="titleColor() || '#2b2b2b'"></span><span class="w-5 h-1 bg-gray-500"></span></span>
            <span class="h-1 bg-gray-200"></span>
            <span class="self-end w-8 h-3 border border-gray-300 mt-auto"></span>
          } @else {
            <span class="flex justify-between"><span class="w-5 h-2 bg-gray-300"></span><span class="w-6 h-1 bg-gray-300"></span></span>
            <span class="flex justify-between mt-1"><span class="w-6 h-2.5 bg-gray-300"></span><span class="w-5 h-2.5 bg-gray-200"></span></span>
            <span class="w-10 h-1.5 bg-gray-700"></span>
            <span class="h-1.5" [style.background]="accentColor() || '#2b2b2b'"></span>
            <span class="h-1 bg-white"></span>
            <span class="h-1 bg-gray-100"></span>
            <span class="h-1 bg-white"></span>
            <span class="h-1 bg-gray-100"></span>
            <span class="self-end w-8 h-4 border border-gray-300 mt-1"></span>
          }
        </span>
        <span class="flex flex-col gap-1 min-w-0">
          <span class="font-medium text-gray-900 flex items-center gap-2">
            {{ option.label | transloco }}
            @if (layout() === option.value) {
              <i class="pi pi-check-circle text-(--p-primary-color)" aria-hidden="true"></i>
            }
          </span>
          @if (!compact()) {
            <span class="text-sm text-gray-600">{{ option.hint | transloco }}</span>
          }
        </span>
      </button>
    }
  </div>

  <div class="grid gap-3" [class]="compact() ? 'grid-cols-3' : 'grid-cols-1 sm:grid-cols-3'" role="radiogroup" [attr.aria-label]="'profile.documentStyle.font' | transloco">
    @for (option of fontOptions; track option.value) {
      <button
        type="button" role="radio" [attr.aria-checked]="font() === option.value" [disabled]="disabled()"
        (click)="pickFont(option.value)"
        class="flex flex-col gap-1 text-left rounded-lg border-2 transition-colors disabled:cursor-default"
        [class]="(compact() ? 'p-2 ' : 'p-3 ')
          + (font() === option.value ? 'border-(--p-primary-color) bg-green-50' : 'bg-white border-gray-200 hover:border-gray-300 enabled:cursor-pointer')"
      >
        <span class="leading-none text-gray-900" [class]="compact() ? 'text-xl' : 'text-2xl'" [style.font-family]="option.family" aria-hidden="true">Aa</span>
        <span class="font-medium text-gray-900 flex items-center gap-1.5" [class.text-sm]="compact()">
          {{ option.label }}
          @if (font() === option.value) {
            <i class="pi pi-check-circle text-(--p-primary-color)" aria-hidden="true"></i>
          }
        </span>
        @if (!compact()) {
          <span class="text-xs text-gray-600">{{ option.hint | transloco }}</span>
        }
      </button>
    }
  </div>
</div>
