<!-- mousedown is cancelled: clicking a button must not take the selection away from the textarea. -->
<div class="flex flex-wrap items-center gap-1 mb-1" role="toolbar" [attr.aria-label]="'textStyle.toolbar' | transloco" (mousedown)="$event.preventDefault()">
  <button type="button" class="w-8 h-8 rounded border border-gray-300 bg-white hover:bg-gray-50 font-bold text-gray-800 cursor-pointer"
    [title]="'textStyle.bold' | transloco" [attr.aria-label]="'textStyle.bold' | transloco" (click)="style('g')">{{ 'textStyle.boldLetter' | transloco }}</button>

  @for (swatch of colors(); track $index; let position = $index) {
    <span class="inline-flex gap-1 pl-1 ml-0.5 border-l border-gray-200">
      <button type="button" class="w-8 h-8 rounded border border-gray-300 bg-white hover:bg-gray-50 flex flex-col items-center justify-center cursor-pointer"
        [title]="'textStyle.textColor' | transloco: { name: swatch.name }" [attr.aria-label]="'textStyle.textColor' | transloco: { name: swatch.name }"
        (click)="style('c' + (position + 1))">
        <span class="font-semibold text-gray-800 leading-none text-sm">A</span>
        <span class="block w-5 h-1 mt-0.5 rounded-sm" [style.background-color]="swatch.color"></span>
      </button>
      <button type="button" class="w-8 h-8 rounded border border-gray-300 bg-white hover:bg-gray-50 flex items-center justify-center cursor-pointer"
        [title]="'textStyle.background' | transloco: { name: swatch.name }" [attr.aria-label]="'textStyle.background' | transloco: { name: swatch.name }"
        (click)="style('f' + (position + 1))">
        <span class="block w-5 h-5 rounded-sm" [style.background-color]="swatch.color"></span>
      </button>
    </span>
  }

  <button type="button" class="w-8 h-8 rounded border border-gray-300 bg-white hover:bg-gray-50 text-gray-600 cursor-pointer"
    [title]="'textStyle.clear' | transloco" [attr.aria-label]="'textStyle.clear' | transloco" (click)="clear()"><i class="pi pi-eraser"></i></button>
  <span class="text-xs text-gray-500 ml-1">{{ (colors().length ? 'textStyle.hint' : 'textStyle.noPalette') | transloco }}</span>
</div>
