<p-toolbar>
  <ng-template #start>
    <h1>Fournisseurs</h1>
  </ng-template>
  <ng-template #end>
    <label class="ui-toolbar__archived">
      <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
      Afficher les archivés
    </label>
    <p-button label="" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </ng-template>
</p-toolbar>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau fournisseur"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-supplier-form [duplicateFrom]="duplicateSource()" (saved)="onSupplierSaved()" (cancelled)="closeCreateDialog()" />
  }
</p-dialog>

<p-table [value]="suppliers()" dataKey="id" showGridlines>
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Société</th>
      <th>Catégorie</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-supplier>
    <tr>
      <td>{{ supplier.supplier_code }}</td>
      <td>{{ supplier.name }}</td>
      <td>{{ supplier.category }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(supplier)" />
        <button type="button" class="pi pi-ellipsis-v" (click)="menu.toggle($event)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
