<div class="supplier-list-header">
  <h1>Fournisseurs</h1>
  <label>
    <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
    Afficher les archivés
  </label>
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="createDialogVisible.set(true)" />
</div>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau fournisseur"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-supplier-form (saved)="onSupplierSaved()" (cancelled)="createDialogVisible.set(false)" />
  }
</p-dialog>

<p-table [value]="suppliers()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Société</th>
      <th>Catégorie</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-supplier>
    <tr>
      <td>{{ supplier.supplier_code }}</td>
      <td>{{ supplier.name }}</td>
      <td>{{ supplier.category }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(supplier)" />
        <button type="button" class="pi pi-ellipsis-v" (click)="menu.toggle($event)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
