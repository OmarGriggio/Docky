@if (supplier(); as s) {
  <p-card [header]="s.name" styleClass="ui-card--elevated">
    <table>
      <tbody>
        <tr><th>Code fournisseur</th><td>{{ s.supplier_code }}</td></tr>
        <tr><th>Société</th><td>{{ s.name }}</td></tr>
        <tr><th>Catégorie</th><td>{{ s.category }}</td></tr>
      </tbody>
    </table>
  </p-card>

  <div class="detail-addresses-header">
    <h2>Adresses</h2>
    <p-button label="Ajouter une adresse" icon="pi pi-plus" (onClick)="addAddressDialogVisible.set(true)" />
  </div>

  <p-table [value]="s.addresses" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Rue</th>
        <th>NPA</th>
        <th>Ville</th>
        <th>Pays</th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-address>
      <tr>
        <td>{{ address.street }}</td>
        <td>{{ address.postal_code }}</td>
        <td>{{ address.city }}</td>
        <td>{{ address.country }}</td>
        <td>
          @if (address.is_primary) {
            <p-tag value="Principale" severity="success" />
          }
        </td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="deleteAddress(address)" />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="addAddressDialogVisible"
    header="Nouvelle adresse"
    [modal]="true"
    [style]="{ width: '28rem' }"
  >
    @if (addAddressDialogVisible()) {
      <app-address-form [supplierId]="s.id" (saved)="onAddressSaved()" (cancelled)="addAddressDialogVisible.set(false)" />
    }
  </p-dialog>

  <app-confirm-dialog
    [(visible)]="confirmVisible"
    title="Suppression"
    [message]="confirmMessage()"
    (confirmed)="onDeleteConfirmed()"
  />
}
