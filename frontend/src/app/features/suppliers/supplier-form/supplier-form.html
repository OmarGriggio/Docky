<form [formGroup]="form" (ngSubmit)="submit()" class="ui-form">
  <p-floatlabel variant="on">
    <input pInputText id="supplier_code" formControlName="supplier_code" />
    <label for="supplier_code">Code fournisseur</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <input pInputText id="name" formControlName="name" />
    <label for="name">Société</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <input pInputText id="category" formControlName="category" />
    <label for="category">Catégorie</label>
  </p-floatlabel>

  <div class="ui-form__actions">
    <p-button type="button" label="Annuler" severity="secondary" (onClick)="cancel()" />
    <p-button type="submit" label="Créer" />
  </div>
</form>
