<div class="flex justify-center py-8 px-4">
  <p-card header="Connexion" styleClass="ui-card--elevated w-full max-w-105">
    <form [formGroup]="form" (ngSubmit)="submit()" class="ui-form ui-form--1col">
      <p-floatlabel variant="on">
        <input pInputText id="email" type="email" formControlName="email" />
        <label for="email">Email</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText id="password" type="password" formControlName="password" />
        <label for="password">Mot de passe</label>
      </p-floatlabel>

      @if (errorMessage()) {
        <p class="text-red-600 m-0">{{ errorMessage() }}</p>
      }

      <div class="col-span-full flex justify-end items-center gap-2">
        <p-button type="submit" label="Se connecter" />
      </div>
    </form>
  </p-card>
</div>
