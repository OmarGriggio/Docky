<div class="auth-page">
  <p-card header="Connexion" styleClass="ui-card--elevated auth-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="ui-form ui-form--1col">
      <p-floatlabel variant="on">
        <input pInputText id="email" type="email" formControlName="email" />
        <label for="email">Email</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText id="password" type="password" formControlName="password" />
        <label for="password">Mot de passe</label>
      </p-floatlabel>

      @if (errorMessage()) {
        <p class="auth-error">{{ errorMessage() }}</p>
      }

      <div class="ui-form__actions auth-form-actions">
        <a routerLink="/register">Créer un compte</a>
        <p-button type="submit" label="Se connecter" />
      </div>
    </form>
  </p-card>
</div>
