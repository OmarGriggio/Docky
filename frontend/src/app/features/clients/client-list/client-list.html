<p-toolbar>
  <ng-template #start>
    <h1>Clients</h1>
  </ng-template>
  <ng-template #end>
    <label class="ui-toolbar__archived">
      <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
      Afficher les archivés
    </label>
    <p-button label="" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </ng-template>
</p-toolbar>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau client"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-client-form [duplicateFrom]="duplicateSource()" (saved)="onClientSaved()" (cancelled)="closeCreateDialog()" />
  }
</p-dialog>

<p-table [value]="clients()" dataKey="id" showGridlines>
  <ng-template #header>
    <tr>
      <th>N° client</th>
      <th>Société</th>
      <th>Nom</th>
      <th>Email</th>
      <th>Téléphones</th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-client>
    <tr>
      <td>{{ client.client_number }}</td>
      <td>{{ client.type }}</td>
      <td>{{ client.company_name }}</td>
      <td>{{ client.first_name }} {{ client.last_name }}</td>
      <td>{{ client.email }}</td>
      <td>{{ client.phone }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(client)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
