<div class="client-list-header">
  <h1>Clients</h1>
  <label>
    <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
    Afficher les archivés
  </label>
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="createDialogVisible.set(true)" />
</div>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau client"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-client-form (saved)="onClientSaved()" (cancelled)="createDialogVisible.set(false)" />
  }
</p-dialog>

<p-table [value]="clients()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>N° client</th>
      <th>Société</th>
      <th>Nom</th>
      <th>Email</th>
      <th>Téléphones</th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-client>
    <tr>
      <td>{{ client.num_client }}</td>
      <td>{{ client.type }}</td>
      <td>{{ client.societe }}</td>
      <td>{{ client.prenom }} {{ client.nom }}</td>
      <td>{{ client.email }}</td>
      <td>{{ client.telephone }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(client)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
