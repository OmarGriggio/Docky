<form [formGroup]="form" (ngSubmit)="submit()" class="ui-form">
  <div class="ui-form__full client-form-type">
    <p-selectbutton
      formControlName="isProfessional"
      [options]="typeOptions()"
      optionLabel="label"
      optionValue="value"
    />
  </div>

  @if (!isProfessional) {
    <p-floatlabel variant="on">
      <input pInputText id="last_name" formControlName="last_name" />
      <label for="last_name">{{ 'clients.columnLastName' | transloco }}</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input pInputText id="first_name" formControlName="first_name" />
      <label for="first_name">{{ 'clients.columnFirstName' | transloco }}</label>
    </p-floatlabel>
  }

  <p-floatlabel variant="on">
    <input pInputText id="title" formControlName="title" />
    <label for="title">{{ 'clients.form.title' | transloco }}</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <input pInputText id="client_number" formControlName="client_number" />
    <label for="client_number">{{ 'clients.columnNumber' | transloco }}</label>
  </p-floatlabel>

  @if (isProfessional) {
    <p-floatlabel variant="on">
      <input pInputText id="company_name" formControlName="company_name" />
      <label for="company_name">{{ 'clients.columnCompany' | transloco }}</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input pInputText id="vat_number" formControlName="vat_number" />
      <label for="vat_number">{{ 'clients.form.vatNumber' | transloco }}</label>
    </p-floatlabel>
  }

  <p-floatlabel variant="on">
    <input pInputText id="email" type="email" formControlName="email" />
    <label for="email">{{ 'clients.columnEmail' | transloco }}</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <input pInputText id="phone" formControlName="phone" />
    <label for="phone">{{ 'clients.columnPhone' | transloco }}</label>
  </p-floatlabel>

  <p-floatlabel variant="on" class="ui-form__full">
    <textarea pTextarea id="note" formControlName="note" rows="4"></textarea>
    <label for="note">{{ 'clients.form.note' | transloco }}</label>
  </p-floatlabel>

  @if (errorMessage()) {
    <p class="ui-form__full text-sm text-red-600">{{ errorMessage() }}</p>
  }

  <div class="ui-form__actions">
    <p-button type="button" [label]="'common.cancel' | transloco" severity="secondary" (onClick)="cancel()" />
    <p-button type="submit" [label]="'clients.form.create' | transloco" />
  </div>
</form>
