<form [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label>N° client</label>
    <input formControlName="num_client" />
  </div>

  <div>
    <label>Civilité</label>
    <input formControlName="civilite" />
  </div>

  <div>
    <label>Nom</label>
    <input formControlName="nom" />
  </div>

  <div>
    <label>Prénom</label>
    <input formControlName="prenom" />
  </div>

  <div>
    <label>Société</label>
    <input formControlName="societe" />
  </div>

  <div>
    <label>TVA</label>
    <input formControlName="tva" />
  </div>

  <div>
    <label>Email</label>
    <input formControlName="email" type="email" />
  </div>

  <div>
    <label>Téléphone</label>
    <input formControlName="telephone" />
  </div>

  <div>
    <label>Remarque</label>
    <textarea formControlName="remarque"></textarea>
  </div>

  <button type="submit">Créer</button>
</form>
