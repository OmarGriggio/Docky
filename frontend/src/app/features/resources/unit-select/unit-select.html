<p-select
  [inputId]="inputId()"
  [fluid]="true"
  [options]="options()"
  optionLabel="label"
  optionValue="value"
  [ngModel]="value()"
  (ngModelChange)="select($event)"
  [disabled]="disabled()"
  [invalid]="invalid()"
  appendTo="body"
>
  <ng-template #item let-option>
    <div class="flex items-center justify-between w-full gap-3">
      <span>{{ option.label }}</span>
      @if (option.unitId !== null) {
        <i class="pi pi-times text-[0.65rem] text-gray-400 hover:text-red-600 cursor-pointer" [title]="'documents.sections.removeUnitTooltip' | transloco" (click)="archiveUnit(option.unitId, $event)"></i>
      }
    </div>
  </ng-template>
  <ng-template #footer>
    <div class="flex gap-2 p-2 border-t border-surface-200">
      <input
        pInputText size="small" [fluid]="true"
        [placeholder]="'documents.sections.newUnitPlaceholder' | transloco"
        #newUnitInput
        (keydown.enter)="addUnit(newUnitInput.value); newUnitInput.value = ''"
      />
      <p-button type="button" icon="pi pi-plus" size="small" (onClick)="addUnit(newUnitInput.value); newUnitInput.value = ''" />
    </div>
  </ng-template>
</p-select>
