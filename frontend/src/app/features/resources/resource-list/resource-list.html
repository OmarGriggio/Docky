<p-toolbar>
  <ng-template #start>
    <h1>Ressources @if (currentTypeLabel()) { — {{ currentTypeLabel() }} }</h1>
  </ng-template>
  <ng-template #end>
    <label class="ui-toolbar__archived">
      <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
      Afficher les archivés
    </label>
    <p-button label="" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </ng-template>
</p-toolbar>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouvelle ressource"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-resource-form [duplicateFrom]="duplicateSource()" (saved)="onResourceSaved()" (cancelled)="closeCreateDialog()" />
  }
</p-dialog>

<p-table [value]="resources()" dataKey="id" showGridlines editMode="cell" (onEditComplete)="onCellEditComplete($event)">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Désignation</th>
      <th>Unité</th>
      <th>Prix de vente</th>
      <th>Prix d'achat</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr>
      <td [pEditableColumn]="item.code" pEditableColumnField="code" [pEditableColumnRowIndex]="rowIndex">
        <p-cellEditor>
          <ng-template #input>
            <input pInputText [(ngModel)]="item.code" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.code }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td [pEditableColumn]="item.name" pEditableColumnField="name" [pEditableColumnRowIndex]="rowIndex">
        <p-cellEditor>
          <ng-template #input>
            <input pInputText [(ngModel)]="item.name" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.name }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td [pEditableColumn]="item.unit" pEditableColumnField="unit" [pEditableColumnRowIndex]="rowIndex">
        <p-cellEditor>
          <ng-template #input>
            <input pInputText [(ngModel)]="item.unit" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.unit }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td [pEditableColumn]="item.selling_price" pEditableColumnField="selling_price" [pEditableColumnRowIndex]="rowIndex">
        <p-cellEditor>
          <ng-template #input>
            <p-inputnumber [(ngModel)]="item.selling_price" mode="decimal" [minFractionDigits]="2" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.selling_price }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td [pEditableColumn]="item.purchase_price" pEditableColumnField="purchase_price" [pEditableColumnRowIndex]="rowIndex">
        <p-cellEditor>
          <ng-template #input>
            <p-inputnumber [(ngModel)]="item.purchase_price" mode="decimal" [minFractionDigits]="2" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.purchase_price }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-menu #menu [popup]="true" [model]="getActions(item)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
