<div class="resource-list-header">
  <h1>Ressources @if (currentTypeLabel()) { — {{ currentTypeLabel() }} }</h1>
  <label>
    <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
    Afficher les archivés
  </label>
</div>

<p-table [value]="resources()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Type</th>
      <th>Désignation</th>
      <th>Unité</th>
      <th>Prix de vente</th>
      <th>Prix d'achat</th>
      <th>Actif</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td>{{ item.type }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.unit }}</td>
      <td>{{ item.selling_price }}</td>
      <td>{{ item.purchase_price }}</td>
      <td>{{ item.is_active }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(item)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
