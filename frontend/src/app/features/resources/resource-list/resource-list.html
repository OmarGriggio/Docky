<p-toolbar class="pt-2! pb-2! rounded-b-none!">
  <ng-template #start>
    <h3>Ressources @if (currentTypeLabel()) { — {{ currentTypeLabel() }} }</h3>
  </ng-template>
  <ng-template #end>
    <label class="ui-toolbar__archived">
      <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
      Afficher les archivés
    </label>
    <p-button size="small" label="" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </ng-template>
</p-toolbar>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouvelle ressource"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-resource-form [duplicateFrom]="duplicateSource()" (saved)="onResourceSaved()" (cancelled)="closeCreateDialog()" />
  }
</p-dialog>

<p-table [value]="resources()" dataKey="id" showGridlines size="small" editMode="row">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Désignation</th>
      <th>Unité</th>
      <th>Prix de vente</th>
      <th>Prix d'achat</th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-item let-editing="editing">
    <tr [pEditableRow]="item">
      <td>
        <p-cellEditor>
          <ng-template #input>
            <input pInputText [(ngModel)]="item.code" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.code }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-cellEditor>
          <ng-template #input>
            <input pInputText [(ngModel)]="item.name" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.name }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-cellEditor>
          <ng-template #input>
            <input pInputText [(ngModel)]="item.unit" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ item.unit }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-cellEditor>
          <ng-template #input>
            <p-inputnumber [(ngModel)]="item.selling_price" mode="decimal" [minFractionDigits]="2" [fluid]="true" [useGrouping]="false" [maxFractionDigits]="2" />
          </ng-template>
          <ng-template #output>
            {{ item.selling_price | price }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-cellEditor>
          <ng-template #input>
            <p-inputnumber [(ngModel)]="item.purchase_price" mode="decimal" [minFractionDigits]="2" [fluid]="true" [useGrouping]="false" [maxFractionDigits]="2" />
          </ng-template>
          <ng-template #output>
            {{ item.purchase_price | price }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td class="w-14">
        <div class="flex gap-1">
          @if (!editing) {
            <p-button type="button" pInitEditableRow icon="pi pi-pencil" [text]="true" severity="secondary" (click)="onRowEditInit(item)" />
          } @else {
            <p-button type="button" pSaveEditableRow icon="pi pi-check" [text]="true" severity="success" (click)="onRowEditSave(item)" />
            <p-button type="button" pCancelEditableRow icon="pi pi-times" [text]="true" severity="danger" (click)="onRowEditCancel(item)" />
          }
        </div>
      </td>

      <td class="w-12">
        <p-menu #menu [popup]="true" [model]="menuItems" appendTo="body"></p-menu>
        <p-button size="small" icon="pi pi-ellipsis-v" [outlined]="true" (click)="openActionsMenu(menu, $event, item)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
