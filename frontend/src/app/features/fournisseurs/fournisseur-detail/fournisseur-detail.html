@if (fournisseur(); as f) {
  <p-card [header]="f.societe" styleClass="ui-card--elevated">
    <table>
      <tbody>
        <tr><th>Code fournisseur</th><td>{{ f.code_fournisseur }}</td></tr>
        <tr><th>Société</th><td>{{ f.societe }}</td></tr>
        <tr><th>Catégorie</th><td>{{ f.categorie }}</td></tr>
      </tbody>
    </table>
  </p-card>

  <div class="detail-adresses-header">
    <h2>Adresses</h2>
    <p-button label="Ajouter une adresse" icon="pi pi-plus" (onClick)="addAdresseDialogVisible.set(true)" />
  </div>

  <p-table [value]="f.adresses" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Rue</th>
        <th>NPA</th>
        <th>Ville</th>
        <th>Pays</th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-adresse>
      <tr>
        <td>{{ adresse.rue }}</td>
        <td>{{ adresse.npa }}</td>
        <td>{{ adresse.ville }}</td>
        <td>{{ adresse.pays }}</td>
        <td>
          @if (adresse.principale) {
            <p-tag value="Principale" severity="success" />
          }
        </td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="deleteAdresse(adresse)" />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="addAdresseDialogVisible"
    header="Nouvelle adresse"
    [modal]="true"
    [style]="{ width: '28rem' }"
  >
    @if (addAdresseDialogVisible()) {
      <app-adresse-form [idFournisseur]="f.id" (saved)="onAdresseSaved()" (cancelled)="addAdresseDialogVisible.set(false)" />
    }
  </p-dialog>

  <app-confirm-dialog
    [(visible)]="confirmVisible"
    title="Suppression"
    [message]="confirmMessage()"
    (confirmed)="onDeleteConfirmed()"
  />
}
