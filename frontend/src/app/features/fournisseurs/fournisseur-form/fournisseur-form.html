<form [formGroup]="form" (ngSubmit)="submit()" class="ui-form">
  <p-floatlabel variant="on">
    <input pInputText id="code_fournisseur" formControlName="code_fournisseur" />
    <label for="code_fournisseur">Code fournisseur</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <input pInputText id="societe" formControlName="societe" />
    <label for="societe">Société</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <input pInputText id="categorie" formControlName="categorie" />
    <label for="categorie">Catégorie</label>
  </p-floatlabel>

  <div class="ui-form__actions">
    <p-button type="button" label="Annuler" severity="secondary" (onClick)="cancel()" />
    <p-button type="submit" label="Créer" />
  </div>
</form>
