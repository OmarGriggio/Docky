<div class="fournisseur-list-header">
  <h1>Fournisseurs</h1>
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="createDialogVisible.set(true)" />
</div>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau fournisseur"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-fournisseur-form (saved)="onFournisseurSaved()" (cancelled)="createDialogVisible.set(false)" />
  }
</p-dialog>

<p-table [value]="fournisseurs()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Société</th>
      <th>Adresse</th>
      <th>Catégorie</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-fournisseur>
    <tr>
      <td>{{ fournisseur.code_fournisseur }}</td>
      <td>{{ fournisseur.societe }}</td>
      <td>{{ fournisseur.adresse }}</td>
      <td>{{ fournisseur.categorie }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(fournisseur)" />
        <button type="button" class="pi pi-ellipsis-v" (click)="menu.toggle($event)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
