<div class="chantier-list-header">
  <h1>Chantiers</h1>
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="createDialogVisible.set(true)" />
</div>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau chantier"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-chantier-form (saved)="onChantierSaved()" (cancelled)="createDialogVisible.set(false)" />
  }
</p-dialog>

<p-table [value]="chantiers()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Client</th>
      <th>Type</th>
      <th>Ville</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-chantier>
    <tr>
      <td>{{ chantier.nom }}</td>
      <td>{{ clientName(chantier) }}</td>
      <td>{{ chantier.type_chantier }}</td>
      <td>{{ chantier.ville }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(chantier)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Suppression"
  [message]="confirmMessage()"
  (confirmed)="onDeleteConfirmed()"
/>
