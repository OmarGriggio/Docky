<form [formGroup]="form" (ngSubmit)="submit()" class="ui-form">
  <p-floatlabel variant="on">
    <p-select
      inputId="id_client"
      formControlName="id_client"
      [options]="clientOptions()"
      optionLabel="label"
      optionValue="value"
    />
    <label for="id_client">Client</label>
  </p-floatlabel>

  <p-floatlabel variant="on" class="ui-form__full">
    <input pInputText id="nom" formControlName="nom" />
    <label for="nom">Nom du chantier</label>
  </p-floatlabel>

  <div class="ui-form__full chantier-form-type">
    <p-floatlabel variant="on" class="chantier-form-type-select">
      <p-select
        inputId="id_type_chantier"
        formControlName="id_type_chantier"
        [options]="typeOptions()"
        optionLabel="label"
        optionValue="value"
      />
      <label for="id_type_chantier">Type de chantier</label>
    </p-floatlabel>

    <p-button type="button" icon="pi pi-plus" label="Nouveau type" severity="secondary" (onClick)="toggleNewType()" />
  </div>

  @if (newTypeVisible()) {
    <div class="ui-form__full chantier-form-new-type">
      <p-floatlabel variant="on" class="chantier-form-new-type-input">
        <input pInputText id="newTypeLibelle" #newTypeInput (keyup.enter)="addTypeChantier(newTypeInput.value); newTypeInput.value = ''" />
        <label for="newTypeLibelle">Libellé du nouveau type</label>
      </p-floatlabel>
      <p-button type="button" label="Ajouter" (onClick)="addTypeChantier(newTypeInput.value); newTypeInput.value = ''" />
    </div>
  }

  <div class="ui-form__full chantier-form-adresse-toggle">
    <p-selectbutton
      formControlName="adresse_identique_client"
      [options]="addresseOptions"
      optionLabel="label"
      optionValue="value"
    />
  </div>

  @if (!adresseIdentiqueClient) {
    <p-floatlabel variant="on">
      <input pInputText id="rue" formControlName="rue" />
      <label for="rue">Rue</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input pInputText id="npa" formControlName="npa" />
      <label for="npa">NPA</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input pInputText id="ville" formControlName="ville" />
      <label for="ville">Ville</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input pInputText id="pays" formControlName="pays" />
      <label for="pays">Pays</label>
    </p-floatlabel>
  }

  <p-floatlabel variant="on" class="ui-form__full">
    <textarea pTextarea id="remarque" formControlName="remarque" rows="4"></textarea>
    <label for="remarque">Remarque</label>
  </p-floatlabel>

  <div class="ui-form__actions">
    <p-button type="button" label="Annuler" severity="secondary" (onClick)="cancel()" />
    <p-button type="submit" label="Créer" />
  </div>
</form>
