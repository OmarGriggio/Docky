<h1>Dashboard</h1>

<h2 class="text-lg font-medium mt-4 mb-2">Montant payé par client</h2>

@if (paidByClient().length === 0) {
  <p class="text-sm text-surface-500">Aucune facture payée pour l'instant.</p>
} @else if (chartData(); as data) {
  <div style="max-width: 40rem">
    <p-chart type="bar" [data]="data" [options]="chartOptions" />
  </div>
}
