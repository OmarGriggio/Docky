<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-4 max-w-3xl">
  <h2 class="text-lg font-medium mt-0 mb-2">Montant payé par client</h2>

  @if (paidByClient().length === 0) {
    <p class="text-sm text-gray-500">Aucune facture payée pour l'instant.</p>
  } @else if (chartData(); as data) {
    <p-chart type="bar" [data]="data" [options]="chartOptions" />
  }
</div>
