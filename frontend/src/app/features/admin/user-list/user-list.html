<h1>Utilisateurs</h1>

<p-table [value]="users()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Email</th>
      <th>Rôle</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-user>
    <tr>
      <td>{{ user.prenom }} {{ user.nom }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(user)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Suppression"
  [message]="confirmMessage()"
  (confirmed)="onDeleteConfirmed()"
/>
