<h3>Utilisateurs</h3>

<!-- On a phone, one card per user instead of the table (same pattern as
     project-list.html). -->
@if (isMobile()) {
  <p-menu #mobileMenu [popup]="true" [model]="menuItems" appendTo="body" />
  <div class="flex flex-col gap-2">
    @for (user of users(); track user.id) {
      <div class="flex items-start gap-2 bg-white border border-gray-200 rounded-lg p-3">
        <div class="flex-1 min-w-0 flex flex-col gap-1">
          <div class="flex items-start justify-between gap-2">
            <span class="font-medium text-gray-900">{{ user.first_name }} {{ user.last_name }}</span>
            <span class="shrink-0 text-sm text-gray-500">{{ user.role }}</span>
          </div>
          <span class="text-sm text-gray-500 truncate">{{ user.email }}</span>
        </div>
        <p-button size="small" icon="pi pi-ellipsis-v" [outlined]="true" (click)="openActionsMenu(mobileMenu, $event, user)" />
      </div>
    }
  </div>
} @else {
  <p-table [value]="users()" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Rôle</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-user>
      <tr>
        <td>{{ user.first_name }} {{ user.last_name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <p-menu #menu [popup]="true" [model]="menuItems" appendTo="body"></p-menu>
          <p-button icon="pi pi-ellipsis-v" (click)="openActionsMenu(menu, $event, user)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
}

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Suppression"
  [message]="confirmMessage()"
  (confirmed)="onDeleteConfirmed()"
/>
