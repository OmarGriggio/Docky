<h1>Ressources @if (currentTypeLabel()) { — {{ currentTypeLabel() }} }</h1>

<p-table [value]="ressources()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Type</th>
      <th>Désignation</th>
      <th>Unité</th>
      <th>Prix de vente</th>
      <th>Prix d'achat</th>
      <th>Actif</th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.code }}</td>
      <td>{{ item.type }}</td>
      <td>{{ item.designation }}</td>
      <td>{{ item.unite }}</td>
      <td>{{ item.prix_vente }}</td>
      <td>{{ item.prix_achat }}</td>
      <td>{{ item.actif }}</td>
    </tr>
  </ng-template>
</p-table>
