<form [formGroup]="form" (ngSubmit)="submit()" class="ui-form">
  <p-floatlabel variant="on">
    <p-select
      inputId="type"
      formControlName="type"
      [options]="typeOptions"
      optionLabel="label"
      optionValue="value"
    />
    <label for="type">Type</label>
  </p-floatlabel>

  <p-floatlabel variant="on" class="ui-form__full">
    <input pInputText id="label" formControlName="label" />
    <label for="label">Libellé</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <p-inputnumber inputId="quantity" formControlName="quantity" mode="decimal" [minFractionDigits]="2" />
    <label for="quantity">Quantité</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <input pInputText id="unit" formControlName="unit" />
    <label for="unit">Unité</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <p-inputnumber inputId="unit_price" formControlName="unit_price" mode="decimal" [minFractionDigits]="2" />
    <label for="unit_price">Prix unitaire</label>
  </p-floatlabel>

  <p-floatlabel variant="on">
    <p-inputnumber inputId="discount" formControlName="discount" mode="decimal" [minFractionDigits]="2" suffix=" %" />
    <label for="discount">Rabais</label>
  </p-floatlabel>

  <div class="ui-form__actions">
    <p-button type="button" label="Annuler" severity="secondary" (onClick)="cancel()" />
    <p-button type="submit" label="Ajouter" />
  </div>
</form>
