<div class="flex justify-center py-8 px-4">
  <p-card styleClass="ui-card--elevated w-full max-w-280">
    <app-document-header
      [company]="company()"
      [logoUrl]="companyLogoUrl()"
      [pageTitle]="pageTitle"
      [type]="type"
      [documentNumber]="documentNumber()"
      [locked]="locked()"
      [clients]="clients()"
      [clientId]="selectedClientId()"
      [addresses]="clientAddresses()"
      [date]="date()"
      (dateChange)="onDateChange($event)"
      [dueDate]="dueDate()"
      (dueDateChange)="onDueDateChange($event)"
      [(addressId)]="addressId"
      [(referenceClient)]="referenceClient"
      (clientChange)="onClientChange($event)"
      (clientCreated)="onClientCreated($event)"
    />

    <div class="mb-6">
      <app-document-text-block
        field="introduction"
        placeholder="Introduction du document..."
        [type]="type"
        [resolve]="resolvePlaceholders"
        [(text)]="introduction"
      />
    </div>

    <app-document-sections [(sections)]="sections" [type]="type" />

    <div class="ui-form mb-4">
      @if (type === 'INVOICE') {
        <p-floatlabel variant="on">
          <p-inputnumber
            pSize="small"
            inputId="discount"
            [ngModel]="discount()"
            (ngModelChange)="discount.set($event)"
            mode="decimal"
            [minFractionDigits]="2"
            suffix=" %"
          />
          <label for="discount">Rabais document</label>
        </p-floatlabel>

        <p-floatlabel variant="on">
          <p-inputnumber
            pSize="small"
            inputId="vatRate"
            [ngModel]="vatRate()"
            (ngModelChange)="vatRate.set($event)"
            mode="decimal"
            [minFractionDigits]="1"
            suffix=" %"
          />
          <label for="vatRate">TVA</label>
        </p-floatlabel>
      }
      <div class="ui-form__full">
        <app-document-text-block
          field="conclusion"
          placeholder="Conclusion du document..."
          [type]="type"
          [resolve]="resolvePlaceholders"
          [(text)]="conclusion"
        />
      </div>
    </div>

    <div class="flex flex-col items-end gap-[0.35rem] mb-6 text-[0.95rem]">
      <div class="flex gap-6 min-w-65 justify-between">
        <span>Sous-total</span><span>{{ documentSubtotal() | price }} CHF</span>
      </div>
      <div class="flex gap-6 min-w-65 justify-between">
        <span>Total HT (après rabais)</span
        ><span>{{ documentTotalAfterDiscount() | price }} CHF</span>
      </div>
      <div
        class="flex gap-6 min-w-65 justify-between font-bold text-[1.1rem] border-t border-[#ddd] pt-[0.35rem]"
      >
        <span>Total TTC</span><span>{{ documentTotalInclVat() | price }} CHF</span>
      </div>
    </div>

    @if (errorMessage()) {
      <p class="text-[#d32f2f] m-0 mb-4">{{ errorMessage() }}</p>
    }

    <div class="ui-form__actions">
      <p-button
        size="small"
        type="button"
        label="Annuler"
        severity="secondary"
        (onClick)="cancel()"
      />
      <p-button
        size="small"
        type="button"
        label="Enregistrer"
        [loading]="submitting()"
        [disabled]="locked()"
        (onClick)="submit()"
      />
    </div>
  </p-card>
</div>
