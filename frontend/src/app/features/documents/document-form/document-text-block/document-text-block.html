@if (locked()) {
  @if (text()) {
    <p class="text-sm text-[#333] m-0 whitespace-pre-wrap">{{ resolve()(text()) }}</p>
  }
} @else if (editing() || !text()) {
  <textarea
    pTextarea
    pSize="small"
    [ngModel]="draft()"
    (ngModelChange)="draft.set($event)"
    rows="4"
    class="w-full"
    [placeholder]="placeholder()"
  ></textarea>
  <p class="m-0 mt-1 text-xs text-gray-500">{{ placeholdersHint() }}</p>
  <div class="flex justify-end items-center gap-3 mt-2">
    <a class="text-sm text-[#666] hover:underline cursor-pointer" (click)="cancelEdit()">{{ 'common.cancel' | transloco }}</a>
    <p-button [label]="'documents.textBlock.apply' | transloco" size="small" severity="secondary" [text]="true" (onClick)="apply()" />
    <p-button [label]="'documents.textBlock.save' | transloco" size="small" [loading]="saving()" (onClick)="confirmSave()" />
  </div>
  @if (saveError()) {
    <p class="m-0 mt-2 text-sm text-[#d32f2f]">{{ saveError() }}</p>
  }
} @else {
  <p class="text-sm text-[#333] m-0 whitespace-pre-wrap">{{ resolve()(text()) }} ... <a class="text-sm hover:underline cursor-pointer text-green-700" (click)="startEdit()">{{ 'documents.textBlock.editText' | transloco }}</a></p>
}

<app-confirm-dialog
  [(visible)]="confirmVisible"
  [title]="'documents.textBlock.saveDefaultTitle' | transloco"
  [message]="confirmMessage()"
  [confirmLabel]="'documentTemplates.save' | transloco"
  (confirmed)="onConfirmed()"
/>
