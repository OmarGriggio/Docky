@if (project(); as p) {
  <div class="flex justify-between items-center mb-4">
    <h1 class="m-0">{{ p.name }}</h1>
    <p-button label="Retour" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
  </div>

  <p-card styleClass="ui-card--elevated mb-6">
    <table>
      <tbody>
        <tr><th>Client</th><td>{{ clientName() }}</td></tr>
        <tr><th>Type</th><td>{{ p.project_type }}</td></tr>
        <tr>
          <th>Adresse</th>
          <td>
            @if (p.same_address_as_client) {
              Identique au client
            } @else {
              {{ p.street }}<br />
              {{ p.postal_code }} {{ p.city }}<br />
              {{ p.country }}
            }
          </td>
        </tr>
        <tr><th>Statut</th><td><p-tag [value]="statusLabel(p)" [severity]="statusSeverity(p)" /></td></tr>
        @if (p.note) {
          <tr><th>Remarque</th><td>{{ p.note }}</td></tr>
        }
      </tbody>
    </table>
  </p-card>

  <h2>Ressources</h2>
  <app-project-resources [project]="p" />
}
