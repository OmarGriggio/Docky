<p-toolbar>
  <ng-template #start>
    <h1>Chantiers</h1>
  </ng-template>
  <ng-template #end>
    <label class="ui-toolbar__archived">
      <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
      Afficher les archivés
    </label>
    <!-- No "Nouveau chantier" trigger for now: a chantier only comes from an
         accepted quote (see document.service.ts's acceptQuoteServ) - the
         dialog/form below still exist, just unreachable from this page,
         should a manual-creation need come back later. -->
  </ng-template>
</p-toolbar>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau chantier"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-project-form [duplicateFrom]="duplicateSource()" (saved)="onProjectSaved()" (cancelled)="closeCreateDialog()" />
  }
</p-dialog>

<p-dialog
  [(visible)]="attachmentsDialogVisible"
  header="Pièces jointes"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (attachmentsDialogVisible() && attachmentsProject()) {
    <app-project-attachments [projectId]="attachmentsProject()!.id" />
  }
</p-dialog>

<p-table [value]="projects()" dataKey="id" showGridlines [tableStyle]="{ 'min-width': '50rem' }" editMode="cell" (onEditComplete)="onCellEditComplete($event)">
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Client</th>
      <th>Type</th>
      <th>Statut</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-project let-rowIndex="rowIndex">
    <tr>
      <td [pEditableColumn]="project.name" pEditableColumnField="name" [pEditableColumnRowIndex]="rowIndex">
        <p-cellEditor>
          <ng-template #input>
            <input pInputText [(ngModel)]="project.name" [fluid]="true" />
          </ng-template>
          <ng-template #output>
            {{ project.name }}
          </ng-template>
        </p-cellEditor>
      </td>

      <!-- Not editable - which client/document a chantier is for never
           changes once created. -->
      <td>{{ clientName(project) }}</td>

      <td [pEditableColumn]="project.project_type_id" pEditableColumnField="project_type_id" [pEditableColumnRowIndex]="rowIndex">
        <p-cellEditor>
          <ng-template #input>
            <p-select [(ngModel)]="project.project_type_id" [options]="typeOptions()" optionLabel="label" optionValue="value" [fluid]="true">
              <ng-template #footer>
                <div class="flex gap-2 p-2 border-t border-surface-200">
                  <input
                    pInputText size="small" [fluid]="true"
                    placeholder="Nouveau type (ex. Parquets)"
                    #newTypeInput
                    (keydown.enter)="addProjectType(project, newTypeInput.value); newTypeInput.value = ''"
                  />
                  <p-button
                    type="button" icon="pi pi-plus" size="small"
                    (onClick)="addProjectType(project, newTypeInput.value); newTypeInput.value = ''"
                  />
                </div>
              </ng-template>
            </p-select>
          </ng-template>
          <ng-template #output>
            <p-tag [value]="project.project_type" severity="secondary" />
          </ng-template>
        </p-cellEditor>
      </td>

      <!-- Not editable - see "Clôturer" in the row menu below instead. -->
      <td><p-tag [value]="statusLabel(project)" [severity]="statusSeverity(project)" /></td>

      <td>
        <p-menu #menu [popup]="true" [model]="getActions(project)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>

<app-confirm-dialog
  [(visible)]="completeConfirmVisible"
  title="Clôture du chantier"
  message="Clôturer ce chantier verrouille ses quantités et permet de le facturer. Continuer ?"
  confirmLabel="Clôturer"
  (confirmed)="onCompleteConfirmed()"
/>
