<div class="project-list-header">
  <h1>Chantiers</h1>
  <label>
    <p-checkbox [binary]="true" [ngModel]="showArchived()" (ngModelChange)="onShowArchivedChange($event)" />
    Afficher les archivés
  </label>
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="createDialogVisible.set(true)" />
</div>

<p-dialog
  [(visible)]="createDialogVisible"
  header="Nouveau chantier"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (createDialogVisible()) {
    <app-project-form (saved)="onProjectSaved()" (cancelled)="createDialogVisible.set(false)" />
  }
</p-dialog>

<p-table [value]="projects()" dataKey="id" showGridlines [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Client</th>
      <th pSortableColumn="project_type"><div>Type</div></th>
      <th>Ville</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-project>
    <tr>
      <td>{{ project.name }}</td>
      <td>{{ clientName(project) }}</td>
      <td><p-tag [value]="project.project_type" severity="secondary" /></td>
      <td>{{ project.city }}</td>
      <td>
        <p-menu #menu [popup]="true" [model]="getActions(project)" appendTo="body"></p-menu>
        <p-button icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Archivage"
  [message]="confirmMessage()"
  (confirmed)="onArchiveConfirmed()"
/>
