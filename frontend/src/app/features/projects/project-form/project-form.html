<form [formGroup]="form" (ngSubmit)="submit()" class="ui-form">
  <p-floatlabel variant="on">
    <p-select
      inputId="client_id"
      formControlName="client_id"
      [options]="clientOptions()"
      optionLabel="label"
      optionValue="value"
    />
    <label for="client_id">{{ 'projects.columnClient' | transloco }}</label>
  </p-floatlabel>

  <p-floatlabel variant="on" class="ui-form__full">
    <input pInputText id="name" formControlName="name" />
    <label for="name">{{ 'projects.form.name' | transloco }}</label>
  </p-floatlabel>

  <div class="ui-form__full project-form-type">
    <p-floatlabel variant="on" class="project-form-type-select">
      <p-select
        inputId="project_type_id"
        formControlName="project_type_id"
        [options]="typeOptions()"
        optionLabel="label"
        optionValue="value"
      />
      <label for="project_type_id">{{ 'projects.form.type' | transloco }}</label>
    </p-floatlabel>

    <p-button type="button" icon="pi pi-plus" [label]="'projects.form.newType' | transloco" severity="secondary" (onClick)="toggleNewType()" />
  </div>

  @if (newTypeVisible()) {
    <div class="ui-form__full project-form-new-type">
      <p-floatlabel variant="on" class="project-form-new-type-input">
        <input pInputText id="newTypeLabel" #newTypeInput (keyup.enter)="addProjectType(newTypeInput.value); newTypeInput.value = ''" />
        <label for="newTypeLabel">{{ 'projects.form.newTypeLabel' | transloco }}</label>
      </p-floatlabel>
      <p-button type="button" [label]="'common.add' | transloco" (onClick)="addProjectType(newTypeInput.value); newTypeInput.value = ''" />
    </div>
  }

  <p-floatlabel variant="on" class="ui-form__full">
    <textarea pTextarea id="note" formControlName="note" rows="4"></textarea>
    <label for="note">{{ 'clients.form.note' | transloco }}</label>
  </p-floatlabel>

  <div class="ui-form__actions">
    <p-button type="button" [label]="'common.cancel' | transloco" severity="secondary" (onClick)="cancel()" />
    <p-button type="submit" [label]="'clients.form.create' | transloco" />
  </div>
</form>
